{% extends "base.html" %}

{% block title %}Anketi sil · Kararsızım{% endblock %}

{% block content %}
  <section class="auth-card card">
    <h1 class="auth-card__title">Anketi sil</h1>
    <p class="auth-card__lead">“{{ poll.question }}” anketi, seçenekleri ve {{ poll.total_votes }} oy kalıcı olarak silinecek. Bu işlem geri alınamaz.</p>
    <form method="post" class="form">
      {% csrf_token %}
      <button type="submit" class="btn btn--danger btn--block">Evet, anketi sil</button>
      <a class="btn btn--ghost btn--block" href="{{ poll.get_absolute_url }}">Vazgeç</a>
    </form>
  </section>
{% endblock %}
