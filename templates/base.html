{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Sen sor, kalabalık karar versin.{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "partials/header.html" %}
  <main class="page" id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/toast.html" %}
  <script src="{% static 'js/toast.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
