<li class="option-row option-row--{{ option.position }}{% if card.show_results %} option-row--result{% endif %}{% if option.is_voted %} option-row--voted{% endif %}">
  {% if card.show_results %}<span class="option-row__fill" style="width: {{ option.percent }}%" aria-hidden="true"></span>{% endif %}
  <span class="option-row__text">{{ option.text }}{% if option.is_voted %} <span class="option-row__check" aria-label="senin oyun">✓</span>{% endif %}</span>
  {% if card.show_results %}<span class="option-row__percent">%{{ option.percent }}</span>{% endif %}
</li>
