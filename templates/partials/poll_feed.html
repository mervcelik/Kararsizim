{% if cards %}
  <div class="poll-grid" data-feed>
    {% for card in cards %}
      {% include "partials/poll_card.html" %}
    {% endfor %}
  </div>
  {% if page.has_next %}
    <div class="feed-more">
      <a class="btn btn--ghost" data-feed-more href="?{% if active_tab %}sekme={{ active_tab }}&amp;{% endif %}page={{ page.next_page_number }}">Daha fazla göster</a>
    </div>
  {% endif %}
{% else %}
  <div class="empty-state card">
    <p class="empty-state__text">{{ empty_text|default:"Henüz anket yok. İlk kararsızlığını sen paylaş." }}</p>
    {% if show_create_cta %}<a class="btn btn--primary" href="{% url 'polls:create' %}">Anket oluştur</a>{% endif %}
  </div>
{% endif %}
